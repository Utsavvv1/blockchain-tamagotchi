[package]
name = "blockchain-tama"
version = "0.1.0"
edition = "2021"

[[bin]]
path = "src/main.rs"
name = "tama"


[dependencies]
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.11.0"
tokio = { version = "1.0", features = ["full"] } 

libp2p = { version = "0.52", features = ["tcp", "dns", "noise", "yamux", "identify", "ping", "gossipsub", "mdns"] }
futures = "0.3"
async-std = { version = "1.12", features = ["attributes"] }
once_cell = "1.21.1"
rand = "0.9.0"
